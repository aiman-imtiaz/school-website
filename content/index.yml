faq:
  title: Frequently Asked Questions
  description: "Answers to common questions about admissions and school life."
  categories:
    - title: Admissions
      questions:
        - label: How do I enroll my child?
          content: |
            Parents can enroll their children by visiting our campus or calling our office.
        - label: Which board examinations do the students partake in?
          content: |
            9th and 10th grade students take the Federal Board of Intermediate and Secondary Education (FBISE) examinations.
        - label: Is there a Kindergarten program available for young children?
          content: |
            Yes, we offer a Kindergarten program for children aged 4-5 years old. The program focuses on early childhood development and prepares children for primary education.
        - label: Does the school offer after-school programs?
          content: |
            Yes, we offer after-school tuition programs, including but not limited to academic enrichment activities. These programs are designed to support students' interests and academic needs.
    - title: Parent/Guardian Engagement
      questions:
        - label: How can I stay updated on school news and events?
          content: |
            Daily updates are shared through our messaging channels. Actively checking the messaging channels is the best way to stay informed. You may also visit our website for information about the school, upcoming events, academic programs, and extracurricular activities.
        - label: How can I contact my child's teachers?
          content: |
            Parents can reach out to teachers via email or through the school's online messaging system to discuss academic performance or any other concerns.
    - title: School Life
      questions:
        - label: Does the school organize trips and events?
          content: |
            Yes. We organize outings for students to places like amusement parks, museums, and zoos, and we arrange cultural celebrations on national holidays, because we believe these experiences enhance learning and create lasting memories.
        - label: What resources are available to students?
          content: |
            Students have access to a library, a computer lab, a science lab, sports facilities, and tutoring services for extra academic support.
