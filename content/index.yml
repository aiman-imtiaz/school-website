about:
  title: "About Our School"
  description: |
  
    Beyond the classroom, we organize outings for students to places like amusement parks, museums, and zoos, believing these trips are a great way to enhance the learning experience and create lasting memories. We also arrange cultural celebrations on national holidays to immerse children in the traditions and values associated with these important dates, and we encourage a love and respect for nature so students can grow into responsible stewards of the environment.
